name: smartcloset_ai
description: SmartCloset AI - Geleceğin Gardırop Deneyimi
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0

  # State Management
  flutter_riverpod: ^2.5.1

  # UI
  flutter_staggered_grid_view: ^0.7.0
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0

  # Local DB
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Storage & Camera
  image_picker: ^1.1.2
  firebase_storage: ^11.6.9
  cached_network_image: ^3.3.1

  # Görsel sıkıştırma — Gemini için ✅
  image: ^4.1.7

  # Utils
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.4.0

  # Location & Weather
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  http: ^1.2.1

  # URL Launcher
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true